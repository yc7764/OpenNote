[project]
name = "opennote-backend"
version = "1.0.0"
description = "OpenNote Django Backend Server"
license = "MIT"
# summary 워커 이미지가 Python 3.10으로 빌드되므로 3.10을 하한으로 둔다.
# 컨테이너 Python 버전 통일(백엔드 3.11 / summary 3.10 / STT 3.12)은 별건.
requires-python = ">=3.10"
dependencies = [
    # ==========================================================================
    # 공통 — 백엔드·STT 워커·summary 워커 중 둘 이상이 쓰는 패키지
    #
    # 여기에 한 번만 정의해 컴포넌트 간 버전이 갈리지 않게 한다.
    # 이전에는 pyproject.toml / pyproject.stt.toml / pyproject.summary.toml에
    # 각각 정의돼 있어 celery·psycopg2·requests·django-storages 버전이 어긋났고,
    # Django 5.2 상향 시 워커만 5.1.5로 남는 사고가 있었다.
    # 특정 컴포넌트가 안 쓰더라도 여기 두어 버전 단일화를 우선한다.
    # ==========================================================================

    # Django Core
    # 5.1 라인은 2025-12 이후 보안 패치 중단(EOL) → 5.2 LTS로 상향
    # 5.2 LTS 지원 종료 2028-04. 6.0은 일반 릴리스라 2027-04로 오히려 짧고
    # Python 3.12+를 요구해 컨테이너 3종의 Python 정리가 선행돼야 함
    "django==5.2.16",

    # Task Queue — kombu는 celery가 맞는 버전을 끌어오므로 고정하지 않는다
    "celery==5.6.3",

    # Database
    "psycopg2-binary==2.9.10",

    # HTTP — 2.31.0에 취약점 6건(세션 TLS 검증 비활성화 전파 포함),
    # 2.32.3에도 4건 잔존. 전부 해소되는 버전으로 상향
    "requests==2.34.2",

    # Storage (S3/MinIO) — summary 워커는 미사용이나 버전 단일화를 위해 공통에 둠
    "django-storages[s3]==1.14.4",
    "boto3==1.34.34",

    # Observability
    "python-json-logger==2.0.7",

    # 워커 공통 — 백엔드는 미사용이나 버전 단일화를 위해 공통에 둠
    "psutil==5.9.8",
    # google-genai가 pydantic>=2.12.5 요구 → 동반 상향 (사용처는 celery_workers/schemas.py의 v2 안정 API뿐)
    "pydantic==2.13.4",
]

[project.optional-dependencies]
# 백엔드(Django 웹) 전용
web = [
    "djangorestframework==3.16.0",
    # 5.5.0은 CVE-2024-22513(비활성 사용자 토큰 유효) — 5.5.1이 픽스
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.7.0",

    # Authentication & OAuth
    # 65.14.2 미만은 X-Forwarded-For 맨 앞 값을 신뢰해 IP 레이트리밋을 우회할 수 있다.
    # 업그레이드 시 ALLAUTH_TRUSTED_PROXY_COUNT 설정이 반드시 함께 필요하다.
    "django-allauth==65.18.0",
    "dj-rest-auth @ git+https://github.com/iMerica/dj-rest-auth.git@c4213c58ad931ea4a27756fd2b38facef1383d38",
    # 2.9.0은 CVE-2026-32597(미지 crit 헤더 수용, High) — 2.12.0이 픽스 (CI trivy 발견)
    "pyjwt==2.12.0",

    # Security & Crypto
    # 44.0.0은 휠 내장 OpenSSL이 취약 버전(High 다수) → 50.0.0 상향
    "cryptography==50.0.0",
    "defusedxml==0.8.0rc2",

    # Cache
    "redis==6.2.0",
    "django-redis==5.4.0",

    # Server
    "gunicorn==23.0.0",
    "whitenoise==6.8.2",

    # Utilities
    "python-magic==0.4.27",
    "mutagen==1.47.0",

    # gevent (async I/O for streaming)
    "gevent>=24.2.1",
    "psycogreen>=1.0.2",

    # Observability
    "django-prometheus==2.3.1",
]

# STT 워커 전용 (GPU)
stt = [
    "faster-whisper>=1.1.0",
    "pyannote.audio>=4.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]

# summary 워커 전용 (LLM)
summary = [
    # google-generativeai는 2026 지원 종료(구글 공지) → 후속 SDK google-genai로 이관
    "google-genai>=2.18.1",
    "groq>=0.11.0",
    # 0.25는 httpcore 0.18→h11 0.14에 묶여 CVE-2025-43859(h11 요청 스머글링) 미해소
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["apps", "config", "celery_workers"]
