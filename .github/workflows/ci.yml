name: ci

# 테스트 → 이미지 빌드. 테스트가 전부 통과해야 이미지 단계가 돈다.
#   - pull_request : 테스트 + 이미지 빌드만(푸시 안 함) — Dockerfile이 깨지지 않았는지 확인
#   - main push    : 테스트 + 이미지 빌드·GHCR 푸시 (태그 sha-<커밋 7자리>)
#   - v* 태그 push : 이미 올라간 sha 이미지에 릴리스 태그만 추가(재빌드 없음)
#
# 이 저장소는 Actions 허용 목록(GitHub 공식 + gitleaks·trivy)과 전체 SHA 고정을 강제한다.
# 그래서 docker/* 서드파티 액션 대신 러너에 기본 설치된 docker CLI를 직접 쓴다.
# Celery 워커 이미지는 자동 배포 대상이 아니라 여기서 빌드하지 않는다.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/yc7764

jobs:
  # ---------------------------------------------------------------------------
  # 테스트
  # ---------------------------------------------------------------------------
  django:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    services:
      # ArrayField 때문에 SQLite 불가 — 운영과 같은 PostgreSQL 16
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opennote
          POSTGRES_PASSWORD: opennote_dev
          POSTGRES_DB: opennote
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opennote -d opennote"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend/python-django
    env:
      # local 설정이 DB 기본값(opennote/opennote_dev@localhost)을 채운다
      DJANGO_SETTINGS_MODULE: config.settings.local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: uv 설치 (Dockerfile과 같은 버전)
        run: pip install uv==0.12.1
      - name: 의존성 설치
        run: uv sync --frozen --python 3.11 --extra web
      - name: 테스트
        # apps만 대상으로 한다 — celery_workers는 torch(GPU 이미지 전용)가 필요해 여기서 import 불가
        run: uv run python manage.py test apps

  sttedit:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/sttEdit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/sttEdit/package-lock.json
      - run: npm ci
      - name: 타입 검사
        run: npx tsc --noEmit -p tsconfig.json
      - name: 테스트
        run: npx jest

  frontend:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 빌드
        run: npx next build

  # ---------------------------------------------------------------------------
  # 이미지 빌드·푸시 (테스트 통과 후)
  # ---------------------------------------------------------------------------
  images:
    if: github.ref_type != 'tag'
    needs: [django, sttedit, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR 푸시 — 이 잡에만 부여
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend/python-django
          - service: sttedit
            context: backend/sttEdit
          - service: frontend
            context: frontend
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: GHCR 로그인
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: 빌더 준비 (레지스트리 캐시를 쓰려면 docker-container 드라이버 필요)
        run: docker buildx create --use --driver docker-container

      - name: 이미지 빌드
        env:
          SERVICE: ${{ matrix.service }}
          CONTEXT: ${{ matrix.context }}
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          IMAGE="$REGISTRY/opennote-$SERVICE"
          TAG="sha-${GITHUB_SHA::7}"
          ARGS=(
            --platform linux/amd64
            --label "org.opencontainers.image.source=$SOURCE_URL"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
            --cache-from "type=registry,ref=$IMAGE:buildcache"
            --tag "$IMAGE:$TAG"
          )
          if [ "$PUSH" = "true" ]; then
            ARGS+=(--push --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max")
          else
            ARGS+=(--load)
          fi
          docker buildx build "${ARGS[@]}" "$CONTEXT"
          echo "IMAGE_REF=$IMAGE:$TAG" >> "$GITHUB_ENV"

      - name: 이미지 취약점 스캔 (보고용)
        # next 14.2.x 잔여 취약점은 major 이관 과제라 지금은 게이트로 걸지 않는다(security.yml과 동일 정책)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

  # ---------------------------------------------------------------------------
  # 릴리스 태그 — 재빌드 없이 기존 sha 이미지에 v* 태그를 추가
  # ---------------------------------------------------------------------------
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: GHCR 로그인
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: sha 이미지에 릴리스 태그 추가
        run: |
          SRC_TAG="sha-${GITHUB_SHA::7}"
          for svc in backend sttedit frontend; do
            IMAGE="$REGISTRY/opennote-$svc"
            if ! docker buildx imagetools inspect "$IMAGE:$SRC_TAG" > /dev/null 2>&1; then
              echo "::error::$IMAGE:$SRC_TAG 이미지가 없습니다. main에 머지되어 CI가 이미지를 올린 커밋에만 릴리스 태그를 다세요."
              exit 1
            fi
            docker buildx imagetools create --tag "$IMAGE:${GITHUB_REF_NAME}" "$IMAGE:$SRC_TAG"
            echo "$IMAGE:${GITHUB_REF_NAME} ← $SRC_TAG"
          done
